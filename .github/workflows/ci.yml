name: CI
run-name: "CI (${{ github.event_name }}) on ${{ github.ref_name }} by @${{ github.actor }}"

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read
  id-token: write

jobs:
  # Lint, vet and the test matrix. Without a vcan interface the Linux
  # interface tests skip there; the vcan job runs them and uploads coverage.
  ci:
    uses: otfabric/.github/.github/workflows/go-ci.yml@v3.3.0
    with:
      run-govulncheck: true
      coverage-min: "85"
      fuzz-time: 10s
      codecov-name: canbusctl
      run-codecov: false
      go-versions: '["1.23", "1.24", "1.25", "1.26"]'
      test-exclude-regex: "/example(s)?($|/)"
      coverpkg: ./...
    secrets: inherit

  # The commands on real vcan interfaces (vcan0, vcan1), natively on amd64
  # and arm64, one package at a time (they share the interfaces), with the
  # end-to-end and chaos tests of the built binary. CANBUS_REQUIRE_VCAN=1
  # turns a missing interface into a failure; where can-isotp loads (or is
  # built from the kernel's source) the kernel ISO-TP tests must pass.
  vcan:
    name: vcan (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Load the CAN modules and create vcan0 and vcan1
        id: modules
        run: |
          scripts/ci-can-modules.sh
          if lsmod | grep -q can_isotp; then echo "isotp=1" >> "$GITHUB_OUTPUT"; fi
          for i in vcan0 vcan1; do
            sudo ip link add "$i" type vcan
            sudo ip link set "$i" mtu 72 up
          done
          sudo ip link add vcanxl0 type vcan && sudo ip link set vcanxl0 mtu 2060 up
      - name: Tests with the race detector (end-to-end and chaos included)
        env:
          CANBUS_REQUIRE_ISOTP: ${{ steps.modules.outputs.isotp }}
          CANBUS_REQUIRE_XL: "1"
        run: make test-vcan
      - name: Coverage (minimum 90 %)
        run: CANBUS_REQUIRE_VCAN=1 CANBUS_REQUIRE_XL=1 make coverage coverage-pkg-check
      - name: Upload to Codecov
        if: matrix.arch == 'amd64'
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: coverage.out
          name: canbusctl
          fail_ci_if_error: false

  # The commands on macOS and Windows: database, trace and virtual-bus
  # commands work, interface commands exit 8.
  portable:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -count=1 ./...
        env:
          GOWORK: "off"

  # Every release platform builds, linux/arm/v7 included (int has 32 bits).
  cross:
    name: Cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make cross
